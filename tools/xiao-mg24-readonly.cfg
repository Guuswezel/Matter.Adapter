# Read-only SWD target definition for pre-flash XIAO MG24 preservation.
# Intentionally contains no flash bank, erase, or program command.
adapter driver cmsis-dap
transport select swd
swd newdap efr32mg24 cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x2ba01477
dap create efr32mg24.dap -chain-position efr32mg24.cpu
target create efr32mg24.cpu cortex_m -dap efr32mg24.dap
adapter speed 1000
