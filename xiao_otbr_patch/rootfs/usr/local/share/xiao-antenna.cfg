# Enable the XIAO MG24 onboard antenna switch before OTBR starts.
source [find interface/cmsis-dap.cfg]
source [find target/efm32s2_g23.cfg]
if {![info exists ::env(XIAO_ADAPTER_SERIAL)] || ![regexp {^[A-Za-z0-9_-]+$} $::env(XIAO_ADAPTER_SERIAL)]} {
    error "XIAO_ADAPTER_SERIAL must identify the selected CMSIS-DAP adapter"
}
adapter serial $::env(XIAO_ADAPTER_SERIAL)
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
reset run
sleep 500
# Secure GPIO aliases can trigger the firmware's SMU violation handler.
set mode [lindex [read_memory 0x5003c064 32 1] 0]
echo "XIAO antenna before: MODEL=$mode DOUT=[read_memory 0x5003c070 32 1]"
# PB4 low selects the onboard antenna; PB5 high powers the RF switch.
# SET/CLR aliases change only the two antenna pins' output values.
mww 0x5003e070 0x10
mww 0x5003d070 0x20
mww 0x5003c064 [expr {($mode & ~0x00ff0000) | 0x00440000}]
set mode_after [lindex [read_memory 0x5003c064 32 1] 0]
set dout_after [lindex [read_memory 0x5003c070 32 1] 0]
if {($mode_after & 0x00ff0000) != 0x00440000 || ($dout_after & 0x30) != 0x20} {
    error "XIAO antenna switch configuration did not verify"
}
echo "XIAO onboard antenna enabled: MODEL=$mode_after DOUT=$dout_after"
echo "CPU state: [[target current] curstate]"
shutdown
